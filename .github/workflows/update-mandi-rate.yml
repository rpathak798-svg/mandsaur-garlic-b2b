name: Update Mandsaur Mandi Rate

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mandi-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update mandi rate file
        run: |
          npm run update:mandi-rate
          npm run update:mandi-history

      - name: Commit updated mandi data
        run: |
          if git diff --quiet -- public/mandi-rate.json public/mandi-history.json; then
            echo "No mandi data change to commit."
            exit 0
          fi
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mandi-rate.json public/mandi-history.json
          git commit -m "Update Mandsaur garlic mandi data"
          git push
