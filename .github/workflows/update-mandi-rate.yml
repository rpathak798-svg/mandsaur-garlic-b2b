name: Update Mandsaur Mandi Rate

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mandi-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update mandi rate file
        run: npm run update:mandi-rate

      - name: Commit updated mandi rate
        run: |
          if git diff --quiet -- public/mandi-rate.json; then
            echo "No mandi rate change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mandi-rate.json
          git commit -m "Update Mandsaur garlic mandi rate"
          git push
